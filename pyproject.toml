[project]
name = "attractorbench"
version = "1.0.0"
description = "Benchmark for measuring coding agent compliance with the Attractor NLSpec suite"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
attractorbench = "attractorbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attractorbench"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
